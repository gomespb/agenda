<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
  font-family: Arial;
  background: #0b0f1a;
  color: white;
  text-align: center;
  margin-top: 100px;
}

.box {
  background: #1c2230;
  padding: 30px;
  border-radius: 10px;
  display: inline-block;
}

input {
  display: block;
  margin: 10px auto;
  padding: 10px;
  width: 220px;
}

button {
  padding: 10px;
  width: 240px;
  background: #00c3ff;
  border: none;
  cursor: pointer;
}

#msg {
  margin-top: 10px;
  color: red;
}
</style>

</head>

<body>

<div class="box">
  <h2>Login</h2>

  <input id="campoCpf" placeholder="CPF">
  <input id="campoSenha" type="password" placeholder="Senha">

<button id="btnEntrar">Entrar</button>

  <p id="msg"></p>
</div>

<script>

// 🚀 SEM onclick → evita conflito
document.getElementById("btnEntrar").addEventListener("click", executarLogin);

function executarLogin() {

  const usuario = document.getElementById("campoCpf").value;
  const senha = document.getElementById("campoSenha").value;

  document.getElementById("msg").innerText = "Verificando...";

  fetch("https://script.google.com/macros/s/AKfycbxntP4xwY8TArURxFZOaIBj9d05zZmZQ_Eyaf8gBDxH-CYSinvEdmqQWskR9SdWzOxjhQ/exec"
    + encodeURIComponent(usuario)
    + "&senha="
    + encodeURIComponent(senha))

  .then(res => res.text())
  .then(text => {

    const data = JSON.parse(text);

    if (data.status === "ok") {
      document.body.innerHTML =
        "<h1>Bem-vindo, " + data.nome + "</h1>";
    } else {
      document.getElementById("msg").innerText =
        "CPF ou senha inválidos";
    }

  })
  .catch(err => {
    document.getElementById("msg").innerText =
      "Erro ao conectar";
    console.error(err);
  });
}

</script>

</body>
</html>

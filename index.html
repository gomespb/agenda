<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      background-color: #12161d;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background-color: #1c222d;
      padding: 40px;
      border-radius: 8px;
      width: 320px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h1 { font-size: 24px; margin-bottom: 30px; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #00c3ff;
      color: #12161d;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { background-color: #555; }
    #erro {
      color: #ff4d4d;
      margin-top: 20px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h1>Login</h1>
  <input type="text" id="userCpf" placeholder="Digite seu CPF">
  <input type="password" placeholder="...">
  <button id="btnEntrar" onclick="logar()">Entrar</button>
  <div id="erro">Erro ao conectar</div>
</div>

<script>
  function logar() {
    const cpf = document.getElementById('userCpf').value;
    const btn = document.getElementById('btnEntrar');
    const erroDiv = document.getElementById('erro');

    if (!cpf) return;

    btn.disabled = true;
    btn.innerHTML = "Aguarde...";
    erroDiv.style.display = "none";

    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          alert("Olá, " + res.nome + "! Acesso concedido.");
          // Redirecionar para o painel de assinaturas aqui
        } else {
          erroDiv.innerText = res.message;
          erroDiv.style.display = "block";
          resetLogin();
        }
      })
      .withFailureHandler(function(err) {
        erroDiv.innerText = "Falha crítica na conexão.";
        erroDiv.style.display = "block";
        resetLogin();
      })
      .validarAcesso(cpf);
  }

  function resetLogin() {
    const btn = document.getElementById('btnEntrar');
    btn.disabled = false;
    btn.innerHTML = "Entrar";
  }
</script>

</body>
</html>

<script>
function login() {

  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;

  document.getElementById("msg").innerText = "Verificando...";

  fetch("https://script.google.com/macros/s/AKfycbzLEkl8KvI9SX56lRf_QecUwvOwNwBLwQACigW6lc5Eeg3ncsTKtEAa638fvVFlJqRwUw/exec?usuario="
    + encodeURIComponent(usuario)
    + "&senha="
    + encodeURIComponent(senha))
    
  .then(response => response.text()) // <- muda aqui
  .then(text => {
    const data = JSON.parse(text);

    if (data.status === "ok") {
      document.body.innerHTML =
        "<h1>Bem-vindo, " + data.nome + "</h1>";
    } else {
      document.getElementById("msg").innerText =
        "CPF ou senha inválidos";
    }
  })

  .catch(err => {
    document.getElementById("msg").innerText =
      "Erro ao conectar";
    console.error(err);
  });
}
</script>

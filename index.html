<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>

<h2>Login a</h2>

<input type="text" id="usuario" placeholder="Usuário"><br><br>
<input type="password" id="senha" placeholder="Senha"><br><br>

<button onclick="login()">Entrar</button>

<p id="msg"></p>

<script>
function login() {
  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;
  const msg = document.getElementById("msg");

  msg.innerText = "Entrando...";

  // 🔥 monta URL
  const url = `https://script.google.com/macros/s/AKfycbwvGmHSQD9MILaCECt_B1GII-SeYrB5cOyptZ7ZlaTnGpwinVTSeiNz1_orI033TQZB/exec?usuario=${encodeURIComponent(usuario)}&senha=${encodeURIComponent(senha)}`;

  // 🔥 cria iframe invisível
  const iframe = document.createElement("iframe");
  iframe.style.display = "none";
  iframe.src = url;

  document.body.appendChild(iframe);

  // 🔥 simula resposta (sem CORS)
  setTimeout(() => {
    msg.innerText = "Login enviado! (verifique validação no script)";
  }, 1000);
}
</script>

</body>
</html>

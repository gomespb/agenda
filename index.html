<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
      font-family: Arial;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #007BFF;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    #msg {
      margin-top: 10px;
      font-size: 14px;
      color: red;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Login</h2>

  <input type="text" id="usuario" placeholder="Usuário">
  <input type="password" id="senha" placeholder="Senha">

  <button onclick="login()">Entrar</button>

  <p id="msg"></p>
</div>

<script>
function login() {
  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;
  const msg = document.getElementById("msg");

  msg.innerText = "Entrando...";

  const formData = new FormData();
  formData.append("usuario", usuario);
  formData.append("senha", senha);

  fetch("https://script.google.com/macros/s/AKfycbxiXRmccrphca-C7jsAifexImFD8L4KddgnCRH-4ELRVYDnjXVsAat93RLlbe_N9u5T/exec", {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if (data.status === "ok") {
      msg.style.color = "green";
      msg.innerText = "Login OK!";
    } else {
      msg.style.color = "red";
      msg.innerText = "Login inválido";
    }
  })
  .catch(err => {
    msg.style.color = "red";
    msg.innerText = "Erro de conexão";
    console.error(err);
  });
}
</script>

</body>
</html>

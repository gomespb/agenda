<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>

<body style="font-family: Arial; text-align:center; margin-top:100px;">

<h2>Login</h2>

<input id="usuario" placeholder="CPF"><br><br> <input id="senha" type="password" placeholder="Senha"><br><br>

<button onclick="login()">Entrar</button>

<p id="msg"></p>

<script>
function login() {

  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;

  document.getElementById("msg").innerText = "Verificando...";

  fetch("https://script.google.com/macros/s/AKfycbzLEkl8KvI9SX56lRf_QecUwvOwNwBLwQACigW6lc5Eeg3ncsTKtEAa638fvVFlJqRwUw/exec?usuario="
    + encodeURIComponent(usuario)
    + "&senha="
    + encodeURIComponent(senha))

  .then(res => res.json())

  .then(data => {
    if (data.status === "ok") {
      document.body.innerHTML =
        "<h1>Bem-vindo, " + data.nome + "</h1>";
    } else {
      document.getElementById("msg").innerText =
        "CPF ou senha inválidos";
    }
  })

  .catch(err => {
    document.getElementById("msg").innerText =
      "Erro ao conectar";
    console.error(err);
  });
}
</script>

</body>
</html>

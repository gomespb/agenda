<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Detalhes | Detalhes que Fazem a Diferença</title>
    
    <!-- Fontes Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* Variáveis de Cores da Logo */
        :root {
            --ouro-logo: #bfa066;
            --vinho-logo: #800020;
            --preto-fundo: #0a0a0a;
            --texto-claro: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            background-color: var(--preto-fundo);
            color: var(--texto-claro);
            overflow-x: hidden;
        }

        /* Cabeçalho Profissional */
        header {
            background-color: rgba(0, 0, 0, 0.95);
            padding: 15px 6%;
            border-bottom: 3px solid var(--ouro-logo);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        /* Lado Esquerdo: Logo */
        .logo-box img {
            height: 110px; /* Destaque para a logo rica em detalhes */
            width: auto;
            transition: transform 0.3s ease;
        }
        
        .logo-box img:hover {
            transform: scale(1.05);
        }

        /* Lado Direito: Menu */
        nav ul {
            list-style: none;
            display: flex;
            gap: 35px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--texto-claro);
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1.5px;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--ouro-logo);
        }

        .login-btn {
            border: 2px solid var(--vinho-logo);
            background-color: transparent;
            padding: 10px 25px;
            border-radius: 3px;
            color: var(--texto-claro) !important;
            box-shadow: inset 0 0 0 0 var(--vinho-logo);
            transition: all 0.4s ease-in-out;
        }

        .login-btn:hover {
            box-shadow: inset 200px 0 0 0 var(--vinho-logo);
            border-color: var(--ouro-logo);
            color: white !important;
        }

        /* Hero Section (Fundo compatível com a Logo) */
        .hero {
            height: 90vh;
            /* Gradiente que imita o fundo da logo (escuro para bronze/vinho) */
            background: 
                linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.9)),
                url('https://images.unsplash.com/photo-1512690196252-7170ef71aac8?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .hero::after {
            content: "";
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(to right, transparent, var(--ouro-logo), transparent);
        }

        .hero h1 {
            font-size: 5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-shadow: 3px 3px 15px rgba(0,0,0,0.9);
            font-family: 'Oswald', sans-serif;
        }

        .hero span {
            color: var(--ouro-logo);
            font-size: 1.8rem;
            font-style: italic;
            margin-bottom: 45px;
            display: block;
            font-weight: 300;
        }

        .cta-main {
            background-color: var(--vinho-logo);
            color: #fff;
            padding: 20px 50px;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid var(--ouro-logo);
            transition: 0.4s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .cta-main:hover {
            background-color: var(--ouro-logo);
            color: #000;
            transform: translateY(-5px);
            letter-spacing: 3px;
        }

        /* Ajuste para dispositivos móveis */
        @media (max-width: 768px) {
            header { flex-direction: column; padding: 25px; }
            .hero h1 { font-size: 3rem; }
            nav ul { margin-top: 20px; gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <!-- Lado Esquerdo: Use o arquivo da logo gerado -->
        <div class="logo-box">
            <img src="logosite.png" alt="Logo Barbearia Detalhes">
        </div>

        <!-- Lado Direito: Menus solicitados -->
        <nav>
            <ul>
                <li><a href="#contato">Fale Conosco</a></li>
                <li><a href="#login" class="login-btn">Faça o Login</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Barbearia Detalhes</h1>
        <span>"Detalhes que fazem a diferença"</span>
        <a href="#" class="cta-main">Agende seu horário</a>
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Detalhes | Detalhes que Fazem a Diferença</title>
    
    <!-- Fontes Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* Variáveis de Cores da Logo Atualizada */
        :root {
            --ouro-logo: #bfa066;
            --vinho-logo: #800020;
            --preto-fundo: #000000; /* Preto absoluto solicitado */
            --texto-claro: #ffffff; /* Branco puro solicitado */
            --prata-logo: #d1d1d1; /* Tom para combinar com o novo detalhe prata */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            background-color: var(--preto-fundo);
            color: var(--texto-claro);
            overflow-x: hidden;
        }

        /* Cabeçalho Profissional - Estrutura em 3 colunas */
        header {
            background-color: var(--preto-fundo);
            padding: 10px 6%;
            border-bottom: 2px solid var(--prata-logo); /* Borda prata para destacar no preto */
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }

        /* Lado Esquerdo: Logo com Borda Redonda */
        .logo-box img {
            height: 90px; 
            width: 90px;
            object-fit: cover;
            border-radius: 50%; /* Borda redonda solicitada */
            border: 2px solid var(--prata-logo); /* Realce para a logo no fundo preto */
            transition: transform 0.3s ease;
        }
        
        .logo-box img:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* Centro: Texto Detalhes Barbearia */
        .header-center-text {
            font-family: 'Oswald', sans-serif;
            color: var(--texto-claro);
            text-transform: uppercase;
            font-size: 1.8rem;
            letter-spacing: 4px;
            font-weight: 700;
        }

        /* Lado Direito: Menu */
        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--texto-claro);
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1.5px;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--ouro-logo);
        }

        .login-btn {
            border: 2px solid var(--vinho-logo);
            padding: 8px 20px;
            border-radius: 4px;
            transition: all 0.4s ease;
        }

        .login-btn:hover {
            background-color: var(--vinho-logo);
            border-color: var(--ouro-logo);
        }

        /* Hero Section */
        .hero {
            height: 85vh;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)),
                url('https://images.unsplash.com/photo-1512690196252-7170ef71aac8?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 4rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-family: 'Oswald', sans-serif;
        }

        .hero span {
            color: var(--ouro-logo);
            font-size: 1.5rem;
            font-style: italic;
            margin-bottom: 40px;
        }

        .cta-main {
            background-color: var(--vinho-logo);
            color: #fff;
            padding: 15px 40px;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid var(--ouro-logo);
            transition: 0.4s;
        }

        .cta-main:hover {
            background-color: var(--texto-claro);
            color: #000;
            letter-spacing: 2px;
        }

        /* Responsividade */
        @media (max-width: 992px) {
            .header-center-text { display: none; } /* Esconde o texto central em telas pequenas */
        }
    </style>
</head>
<body>

    <header>
        <!-- Lado Esquerdo -->
        <div class="logo-box">
            <!-- Certifique-se de usar a imagem watermarked_img_12198924502264994326.png -->
            <img src="logosite.png" alt="Logo Barbearia Detalhes">
        </div>

        <!-- Centro -->
        <div class="header-center-text">
            DETALHES BARBEARIA
        </div>

        <!-- Lado Direito -->
        <nav>
            <ul>
                <li><a href="#contato">Fale Conosco</a></li>
                <li><a href="#login" class="login-btn">Faça o Login</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Detalhes Prótese Capilar</h1>
        <span>"Detalhes que fazem a diferença"</span>
        <a href="#" class="cta-main">Agende sua Avaliação</a>
    </section>

</body>
</html>

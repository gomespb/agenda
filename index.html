<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>

<body style="font-family:Arial;text-align:center;margin-top:100px;">

<h2>Login</h2>

<input id="cpfInput" placeholder="CPF"><br><br> <input id="senhaInput" type="password" placeholder="Senha"><br><br>

<button id="btnAcessar">Entrar</button>

<p id="msg"></p>

<script>

document.getElementById("btnAcessar").addEventListener("click", executar);

function executar() {

  const cpf = document.getElementById("cpfInput").value;
  const senha = document.getElementById("senhaInput").value;

  document.getElementById("msg").innerText = "Verificando...";

  fetch("https://script.google.com/macros/s/AKfycbzLEkl8KvI9SX56lRf_QecUwvOwNwBLwQACigW6lc5Eeg3ncsTKtEAa638fvVFlJqRwUw/exec?usuario="
    + encodeURIComponent(cpf)
    + "&senha="
    + encodeURIComponent(senha))

  .then(r => r.text())
  .then(txt => {

    const data = JSON.parse(txt);

    if (data.status === "ok") {
      document.body.innerHTML =
        "<h1>Bem-vindo " + data.nome + "</h1>";
    } else {
      document.getElementById("msg").innerText =
        "CPF ou senha inválidos";
    }

  })
  .catch(e => {
    document.getElementById("msg").innerText =
      "Erro ao conectar";
  });
}

</script>

</body>
</html>
